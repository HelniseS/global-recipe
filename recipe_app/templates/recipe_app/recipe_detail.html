{% extends "base.html" %}
{% block title %}{{ recipe.title }} · Global Recipe{% endblock %}
{% block content %}

<div class="row g-4">
  <div class="col-lg-5">
    {% if recipe.image %}
      <img class="img-fluid rounded border" src="{{ recipe.image.url }}" alt="{{ recipe.title }}">
    {% endif %}
    <div class="mt-2 small text-muted">
      Posted by {{ recipe.author }} · {{ recipe.created_at|date:"M j, Y" }}
    </div>
  </div>
