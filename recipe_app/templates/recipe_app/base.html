<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Global Recipe{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
<nav class="navbar navbar-expand-lg bg-light border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'recipe_app:home' %}"> GlobalRecipe</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

  <div id="nav" class="collapse navbar-collapse">
      <form class="d-flex ms-auto" role="search" action="{% url 'recipe_app:recipe_list' %}">
        <input class="form-control me-2" type="search" name="q" placeholder="Search recipes…" value="{{ q|default:'' }}">
        <button class="btn btn-primary">Search</button>
      </form>
      
      <ul class="navbar-nav ms-3">
        {% if user.is_authenticated %}
          <li class="nav-item"><a class="nav-link" href="{% url 'recipe_app:recipe_add' %}">Add Recipe</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Logout</a></li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<main class="py-4">
  <div class="container">
    {% if messages %}
      {% for m in messages %}
        <div class="alert alert-{{ m.tags }} mb-3">{{ m }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</main>

<footer class="border-top py-3">
  <div class="container small text-muted">
    © {{ now|date:"Y" }} GlobalRecipe
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
