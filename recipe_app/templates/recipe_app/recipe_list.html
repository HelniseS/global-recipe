{% extends "base.html" %}
{% block title %}Recipes · Global Recipe{% endblock %}
{% block content %}

<h1 class="h3 mb-3">Recipes</h1>

<form method="get" class="row g-2 align-items-end mb-3">
  <div class="col-sm-5">
    <label class="form-label">Search</label>
    <input name="q" value="{{ q }}" class="form-control" placeholder="Search title, description, ingredients…">
  </div>
  <div class="col-sm-3">
    <label class="form-label">Category</label>
    <select name="category" class="form-select">
      <option value="">Any</option>
      {% for key, label in recipes.paginator.object_list.model.CATEGORY_CHOICES %}
        <option value="{{ key }}" {% if active_category == key %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
